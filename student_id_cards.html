<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID Card Records</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f0f4f8;--card-bg:#ffffff;--text:#0f172a;--text-light:#64748b;--border:#e2e8f0;--radius:14px;
    --shadow:0 2px 12px rgba(0,0,0,.09),0 1px 4px rgba(0,0,0,.06);
    --shadow-lg:0 24px 48px rgba(0,0,0,.16),0 8px 20px rgba(0,0,0,.08);}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Inter',sans-serif;background:linear-gradient(145deg,#0d1b2a 0%,#1a2f50 45%,#2d1b4e 100%);
    background-attachment:fixed;min-height:100vh;padding:2rem 1rem;color:var(--text);}
.container{max-width:1440px;margin:0 auto;}
.page-header{text-align:center;margin-bottom:2rem;color:#fff;}
.page-header-pill{display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.9);font-size:.7rem;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;padding:.35rem 1.1rem;border-radius:9999px;margin-bottom:.9rem;}
.page-header h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.8rem,5vw,3rem);font-weight:700;
    line-height:1.1;margin-bottom:.4rem;text-shadow:0 3px 10px rgba(0,0,0,.35);}
.page-header p{opacity:.6;font-size:clamp(.78rem,1.8vw,.92rem);}
.control-panel{background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.7);
    padding:1.25rem 1.5rem;border-radius:var(--radius);margin-bottom:2rem;box-shadow:var(--shadow-lg);}
.filters-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.75rem;}
.search-wrap{position:relative;flex:2;min-width:200px;}
.search-wrap .s-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;}
.search-wrap input{width:100%;padding:.78rem 1rem .78rem 2.6rem;border:2px solid var(--border);border-radius:.6rem;
    font-size:max(16px,.875rem);font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
    transition:border-color .2s,box-shadow .2s;}
.search-wrap input:focus{outline:none;border-color:#3b82f6;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.15);}
.search-wrap input::placeholder{color:#94a3b8;}
.filter-toggle-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.78rem 1.1rem;
    border:2px solid var(--border);border-radius:.6rem;background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;
    transition:all .2s;white-space:nowrap;user-select:none;}
.filter-toggle-btn:hover,.filter-toggle-btn.active{border-color:#3b82f6;color:#1e3a8a;background:#eff6ff;}
.filter-badge{display:inline-flex;align-items:center;justify-content:center;background:#3b82f6;color:#fff;
    border-radius:9999px;font-size:.65rem;font-weight:700;min-width:18px;height:18px;padding:0 4px;}
.clear-btn{padding:.78rem 1rem;border:2px solid var(--border);border-radius:.6rem;background:transparent;
    color:var(--text-light);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;
    cursor:pointer;transition:all .2s;white-space:nowrap;}
.clear-btn:hover{border-color:#ef4444;color:#ef4444;background:#fef2f2;}
.cb-panel{display:none;border-top:1px solid var(--border);padding-top:1rem;margin-top:.5rem;margin-bottom:.5rem;}
.cb-panel.open{display:block;}
.cb-groups{display:flex;gap:1.5rem;flex-wrap:wrap;}
.cb-group{flex:1;min-width:130px;}
.cb-group-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    color:var(--text-light);margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem;}
.cb-group-title .select-all-btn{font-size:.62rem;font-weight:600;color:#3b82f6;background:none;border:none;
    cursor:pointer;padding:0;text-decoration:underline;letter-spacing:0;text-transform:none;font-family:'Inter',sans-serif;}
.cb-list{display:flex;flex-direction:column;gap:.32rem;max-height:180px;overflow-y:auto;}
.cb-item{display:flex;align-items:center;gap:.45rem;cursor:pointer;}
.cb-item input[type=checkbox]{width:15px;height:15px;accent-color:#3b82f6;cursor:pointer;flex-shrink:0;}
.cb-item label{font-size:.8rem;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.toolbar-bottom{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;
    border-top:1px solid var(--border);padding-top:1rem;}
.stats{display:flex;gap:1.5rem;}
.stat-item{text-align:center;}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;font-weight:700;color:#1e3a8a;line-height:1;}
.stat-label{font-size:.67rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;margin-top:.15rem;}
.active-tags{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;flex:1;}
.atag{display:inline-flex;align-items:center;gap:.3rem;background:#eff6ff;border:1px solid #bfdbfe;
    color:#1e3a8a;font-size:.7rem;font-weight:600;padding:.18rem .55rem;border-radius:9999px;}
.atag-x{cursor:pointer;opacity:.6;font-size:.75rem;background:none;border:none;color:inherit;padding:0;font-family:inherit;}
.atag-x:hover{opacity:1;}
.export-btn{display:inline-flex;align-items:center;gap:.4rem;
    background:linear-gradient(135deg,#1e3a8a 0%,#3b82f6 100%);color:#fff;border:none;
    padding:.7rem 1.3rem;border-radius:.6rem;font-family:'Inter',sans-serif;font-size:.82rem;
    font-weight:600;cursor:pointer;transition:opacity .2s,transform .15s;white-space:nowrap;}
.export-btn:hover{opacity:.88;transform:translateY(-1px);}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.25rem;margin-bottom:2rem;}
.id-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s;display:flex;flex-direction:column;}
.id-card:hover{transform:translateY(-4px) scale(1.012);box-shadow:var(--shadow-lg);}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1rem;
    background:linear-gradient(135deg,#1e3a8a 0%,#3b82f6 100%);color:#fff;}
.header-left{display:flex;flex-direction:column;gap:.18rem;}
.header-sno{font-size:.68rem;font-weight:700;opacity:.75;letter-spacing:.06em;}
.header-appar{font-size:.72rem;font-weight:600;opacity:.9;}
.header-right{display:flex;align-items:center;gap:.65rem;}
.house-badge{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    background:rgba(255,255,255,.22);padding:.2rem .55rem;border-radius:9999px;}
.photo-wrap{width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,255,255,.7);overflow:hidden;
    flex-shrink:0;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.photo-wrap img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s;display:block;}
.photo-wrap img.loaded{opacity:1;}
.card-body{padding:1rem;flex:1;border-left:4px solid #3b82f6;}
.student-name{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;color:#1e3a8a;
    margin-bottom:.75rem;line-height:1.25;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.info-item{display:flex;flex-direction:column;gap:.05rem;}
.info-item.fw{grid-column:1/-1;}
.info-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-light);}
.info-value{font-size:.82rem;color:var(--text);font-weight:500;word-break:break-word;}
.info-value a{color:inherit;text-decoration:none;}
.blood-tag{display:inline-block;background:#fee2e2;color:#991b1b;padding:.1rem .4rem;border-radius:4px;font-size:.78rem;font-weight:700;}
.gender-tag{display:inline-block;padding:.1rem .4rem;border-radius:4px;font-size:.78rem;font-weight:600;}
.gender-male{background:#eff6ff;color:#1d4ed8;}
.gender-female{background:#fdf2f8;color:#9d174d;}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding:.55rem 1rem;
    background:#f8fafc;border-top:1px solid var(--border);}
.session-badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:#fff;background:#1e3a8a;padding:.2rem .6rem;border-radius:4px;}
.sno-label{font-size:.72rem;font-weight:700;color:#3b82f6;}
.hl{background:#fef08a;color:#713f12;border-radius:2px;padding:0 1px;}
.no-results{text-align:center;padding:4rem 1rem;color:rgba(255,255,255,.7);}
.no-results-icon{font-size:3rem;margin-bottom:1rem;}
.no-results h2{font-size:1.4rem;margin-bottom:.5rem;color:#fff;}
.pagination-wrap{display:flex;flex-direction:column;align-items:center;gap:.75rem;margin:.5rem 0 3rem;}
.pagination-info{color:rgba(255,255,255,.7);font-size:.82rem;font-weight:500;}
.pagination{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;align-items:center;}
.pg-btn{min-width:38px;height:38px;padding:0 .6rem;border:none;border-radius:8px;font-family:'Inter',sans-serif;
    font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;
    background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;}
.pg-btn:hover:not(:disabled):not(.active){background:rgba(255,255,255,.22);color:#fff;transform:translateY(-1px);}
.pg-btn.active{background:#3b82f6;color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.45);}
.pg-btn:disabled{opacity:.3;cursor:not-allowed;}
.pg-ellipsis{color:rgba(255,255,255,.45);font-size:.85rem;padding:0 .25rem;line-height:38px;}
.pg-jump{display:flex;align-items:center;gap:.4rem;color:rgba(255,255,255,.7);font-size:.8rem;}
.pg-jump input{width:52px;height:32px;text-align:center;border:1px solid rgba(255,255,255,.25);border-radius:6px;
    background:rgba(255,255,255,.1);color:#fff;font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;}

        .hdr-arawali { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); }

        .id-card.card-arawali .session-badge { background: #1a237e; }
        .id-card.card-arawali .sno-label     { color: #283593; }
        .id-card.card-arawali .card-body     { border-left: 4px solid #3949ab; }

        .hdr-neelgiri { background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); }
        .id-card.card-neelgiri .student-name  { color: #2e7d32; }
        .id-card.card-neelgiri .card-footer   { background: #e8f5e9; border-top-color: #a5d6a7; }
        .id-card.card-neelgiri .session-badge { background: #2e7d32; }
        .id-card.card-neelgiri .sno-label     { color: #1b5e20; }
        .id-card.card-neelgiri .card-body     { border-left: 4px solid #388e3c; }

        .hdr-shivalik { background: linear-gradient(135deg, #b71c1c 0%, #7f0000 100%); }
        .id-card.card-shivalik .student-name  { color: #b71c1c; }
        .id-card.card-shivalik .card-footer   { background: #ffebee; border-top-color: #ef9a9a; }
        .id-card.card-shivalik .session-badge { background: #b71c1c; }
        .id-card.card-shivalik .sno-label     { color: #7f0000; }
        .id-card.card-shivalik .card-body     { border-left: 4px solid #c62828; }

        .hdr-udaigiri { background: linear-gradient(135deg, #f9a800 0%, #c17f00 100%); }
        .id-card.card-udaigiri .student-name  { color: #92400e; }
        .id-card.card-udaigiri .card-footer   { background: #fffbeb; border-top-color: #fcd34d; }
        .id-card.card-udaigiri .session-badge { background: #b45309; }
        .id-card.card-udaigiri .sno-label     { color: #92400e; }
        .id-card.card-udaigiri .card-body     { border-left: 4px solid #d97706; }
</style>
</head>

<div class="container">
<div class="page-header">

            ⚙️ Filters <span class="filter-badge" id="filterBadge" style="display:none">0</span> ▾

    <div class="cb-panel" id="cbPanel">

            </div>
            <div class="cb-group">
                <div class="cb-group-title">🔤 Section <button class="select-all-btn" onclick="toggleAllGroup('section')">Select All</button></div>
                <div class="cb-list" id="cb-section"></div>
            </div>
            <div class="cb-group">
                <div class="cb-group-title">⚧ Gender <button class="select-all-btn" onclick="toggleAllGroup('gender')">Select All</button></div>
                <div class="cb-list" id="cb-gender"></div>

    <div class="toolbar-bottom">

            <div class="stat-item"><div class="stat-value" id="showingCount">0</div><div class="stat-label">Showing</div></div>
        </div>
        <div class="active-tags" id="activeTags"></div>
    </div>
</div>
<div class="cards-grid" id="cardsGrid"></div>
<div class="no-results" id="noResults" style="display:none;">
    <div class="no-results-icon">🔍</div><h2>No students found</h2><p>Try adjusting your search or filters</p>
</div>
<div class="pagination-wrap" id="paginationWrap" style="display:none;">
    <div class="pagination-info" id="paginationInfo"></div>
    <div class="pagination" id="pagination"></div>
    <div class="pg-jump">Go to page <input type="number" id="jumpInput" min="1" placeholder="—" onkeydown="if(event.key==='Enter')jumpToPage()"></div>
</div>
</div>

function hi(t,term){if(!term||!t)return esc(t);const re=new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return esc(t).replace(re,'<span class="hl">$1</span>');}
function buildCard(s,term){const hm=houseMap[s.house.trim()]||{hdr:'',card:''};const hn=esc(s.house.replace(/\s*House$/i,'').trim());const ph=s.photo?`<div class="photo-wrap"><img class="lazy" data-src="${esc(s.photo)}" alt="${esc(s.name)}" width="80" height="80"></div>`:`<div class="photo-wrap">👤</div>`;
return`<div class="id-card ${hm.card}"><div class="card-header ${hm.hdr}"><div class="header-left"><span class="header-sno">No. ${s.sno}</span><span class="header-appar">ID: ${hi(s.apparId||'N/A',term)}</span></div><div class="header-right"><span class="house-badge">${hn}</span>${ph}</div></div><div class="card-body"><div class="student-name">${hi(s.name,term)}</div><div class="info-grid"><div class="info-item"><span class="info-label">Class &amp; Section</span><span class="info-value">${esc(s.class)} – ${esc(s.section)}</span></div><div class="info-item"><span class="info-label">Date of Birth</span><span class="info-value">${esc(s.dob)}</span></div><div class="info-item"><span class="info-label">Blood Group</span><span class="info-value"><span class="blood-tag">🩸 ${esc(s.bloodGroup)}</span></span></div><div class="info-item"><span class="info-label">Gender</span><span class="info-value"><span class="gender-tag gender-${(s.gender||'').toLowerCase()}">${s.gender==='Male'?'♂':s.gender==='Female'?'♀':'⚧'} ${esc(s.gender||'N/A')}</span></span></div><div class="info-item"><span class="info-label">Phone</span><span class="info-value"><a href="tel:${esc(s.phone)}">📞 ${esc(s.phone)}</a></span></div><div class="info-item"><span class="info-label">Father's Name</span><span class="info-value">${hi(s.father,term)}</span></div><div class="info-item"><span class="info-label">Mother's Name</span><span class="info-value">${hi(s.mother,term)}</span></div><div class="info-item fw"><span class="info-label">Address</span><span class="info-value">${hi(s.address,term)}</span></div></div></div><div class="card-footer"><span class="session-badge">${esc(s.session)}</span><span class="sno-label">#${s.sno}</span></div></div>`;}
function render(scroll){const grid=document.getElementById('cardsGrid'),none=document.getElementById('noResults'),wrap=document.getElementById('paginationWrap'),total=filteredList.length,tp=Math.max(1,Math.ceil(total/PAGE_SIZE));if(currentPage>tp)currentPage=tp;document.getElementById('matchCount').textContent=total;if(!total){grid.innerHTML='';none.style.display='block';wrap.style.display='none';document.getElementById('showingCount').textContent=0;return;}none.style.display='none';const start=(currentPage-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,total);document.getElementById('showingCount').textContent=end-start;grid.innerHTML=filteredList.slice(start,end).map(s=>buildCard(s,currentTerm)).join('');observeImages();if(scroll)grid.scrollIntoView({behavior:'smooth',block:'start'});if(tp<=1){wrap.style.display='none';return;}wrap.style.display='flex';document.getElementById('paginationInfo').textContent=`Showing ${start+1}–${end} of ${total} students  ·  Page ${currentPage} of ${tp}`;document.getElementById('jumpInput').max=tp;document.getElementById('jumpInput').value='';renderPgBtns(tp);}
function renderPgBtns(tp){const pg=currentPage,pages=[];if(tp<=9){for(let i=1;i<=tp;i++)pages.push(i);}else{pages.push(1);if(pg>4)pages.push('…');const lo=Math.max(2,pg-2),hi2=Math.min(tp-1,pg+2);for(let i=lo;i<=hi2;i++)pages.push(i);if(pg<tp-3)pages.push('…');pages.push(tp);}let h=`<button class="pg-btn" onclick="goPage(${pg-1})" ${pg===1?'disabled':''}>‹ Prev</button>`;pages.forEach(p=>{h+=p==='…'?`<span class="pg-ellipsis">…</span>`:`<button class="pg-btn ${p===pg?'active':''}" onclick="goPage(${p})">${p}</button>`;});h+=`<button class="pg-btn" onclick="goPage(${pg+1})" ${pg===tp?'disabled':''}>Next ›</button>`;document.getElementById('pagination').innerHTML=h;}
function goPage(n){const tp=Math.ceil(filteredList.length/PAGE_SIZE);if(n<1||n>tp)return;currentPage=n;render(true);}
function jumpToPage(){const v=parseInt(document.getElementById('jumpInput').value,10);if(!isNaN(v))goPage(v);}
function applyFilters(){const term=document.getElementById('searchInput').value.trim(),houses=getChecked('house'),classes=getChecked('class'),secs=getChecked('section'),gens=getChecked('gender'),low=term.toLowerCase();currentTerm=term;currentPage=1;filteredList=students.filter(s=>{if(houses.length&&!houses.includes(s.house.trim()))return false;if(classes.length&&!classes.includes(s.class.trim()))return false;if(secs.length&&!secs.includes(s.section.trim()))return false;if(gens.length&&!gens.includes(s.gender.trim()))return false;if(low){const hay=[s.name,s.apparId,s.house,s.bloodGroup,s.father,s.mother,s.phone,s.address,s.class,s.section,s.gender].join(' ').toLowerCase();if(!hay.includes(low))return false;}return true;});render();const count=houses.length+classes.length+secs.length+gens.length+(term?1:0);const badge=document.getElementById('filterBadge');if(count>0){badge.textContent=count;badge.style.display='inline-flex';}else badge.style.display='none';const tags=[];if(term)tags.push({label:'🔍 '+term,action:'clearSearch'});houses.forEach(v=>tags.push({label:'🏠 '+v,action:'uncheck',group:'house',val:v}));classes.forEach(v=>tags.push({label:'📚 Class '+v,action:'uncheck',group:'class',val:v}));secs.forEach(v=>tags.push({label:'🔤 Sec '+v,action:'uncheck',group:'section',val:v}));gens.forEach(v=>tags.push({label:(v==='Male'?'♂':'♀')+' '+v,action:'uncheck',group:'gender',val:v}));document.getElementById('activeTags').innerHTML=tags.map((t,i)=>`<span class="atag">${esc(t.label)}<button class="atag-x" onclick="removeTag(${i})" title="Remove">✕</button></span>`).join('');window._activeTags=tags;}
function removeTag(i){const t=window._activeTags[i];if(!t)return;if(t.action==='clearSearch')document.getElementById('searchInput').value='';else if(t.action==='uncheck'){const cb=[...document.querySelectorAll(`.cb-${t.group}`)].find(b=>b.value===t.val);if(cb)cb.checked=false;}applyFilters();}
function clearFilters(){document.getElementById('searchInput').value='';document.querySelectorAll('.cb-house,.cb-class,.cb-section,.cb-gender').forEach(b=>b.checked=false);applyFilters();}
function exportToCSV(){const hdr=['S.No','Student Name','APPAR ID','Class','Section','House','Date of Birth','Blood Group','Gender','Session','Father Name','Mother Name','Phone Number','Address'];const rows=filteredList.map(s=>[s.sno,s.name,s.apparId,s.class,s.section,s.house,s.dob,s.bloodGroup,s.gender,s.session,s.father,s.mother,s.phone,s.address].map(v=>'"'+String(v||'').replace(/[–—―]/g,'-').replace(/ /g,' ').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\r?\n|\r/g,' ').replace(/"/g,'""')+'"'));const csv=[hdr.join(','),...rows.map(r=>r.join(','))].join('\r\n');const blob=new Blob([new TextEncoder().encode('\uFEFF'+csv)],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const classes=getChecked('class'),houses=getChecked('house'),parts=[];if(classes.length)parts.push('Class'+classes.join('_'));if(houses.length)parts.push(houses.join('_'));const fname='students'+(parts.length?'_'+parts.join('_'):'')+'.csv';Object.assign(document.createElement('a'),{href:url,download:fname}).click();URL.revokeObjectURL(url);}
function db(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
document.getElementById('totalCount').textContent=students.length;
render();
document.getElementById('searchInput').addEventListener('input',db(applyFilters,250));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('searchInput').focus();}});
</script>
</body>
</html>
